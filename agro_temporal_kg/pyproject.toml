[project]
name = "agro-temporal-kg"
version = "0.1.0"
description = ""
authors = [{ name = "Pablo Sanchez-Martin", email = "pablo.sanchez2@sony.com" }]
requires-python = ">=3.10, <3.13"
readme = "README.md"
dependencies = [
    "graphiti-core[falkordb]",
    "hydra-core>=1.3.0",
    "langchain>=1.0.2",
    "langchain-experimental>=0.0.42",
    "langchain-openai>=1.0.1",
    "langchain-text-splitters>=1.0.0",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "pathlib>=1.0.1",
    "polars>=1.36.1",
    "pycountry>=24.6.1",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.1.1",
    "typer>=0.20.0",
    "zenml[local,server]>=0.93.0",
]


[dependency-groups]
prebuild = [
    "pytest>=8.2.2,<9",
    "mypy>=1.10.1,<2",
    "ruff>=0.9.1,<0.10",
]
dev = [
    "ipykernel>=6.29.5,<7",
]

[tool.uv]
default-groups = [
    "prebuild",
    "dev",
]

[tool.uv.sources]
graphiti-core = { path = "../graphiti", editable = true }



[tool.hatch.build.targets.sdist]
include = ["agro_temporal_kg"]

[tool.hatch.build.targets.wheel]
include = ["agro_temporal_kg"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = [
    "agro_temporal_kg/**/*.py",
    "tests/**/*.py"
]

[tool.ruff]
line-length = 100

extend-exclude = [".md", ".json", "misc/"]

# Make ruff compatible with black
respect-gitignore = true
force-exclude = true

[tool.ruff.lint]

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (finds likely bugs)
    "C4",  # flake8-comprehensions
    "RET", # flake8-return (return statement checks)
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "ERA", # erad icate (commented out code)
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TCH", # type-checking imports
    "TRY", # try-except style
]

ignore = ["B008", "PLR0913", "RUF007"]

[tool.ruff.format]

# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"

