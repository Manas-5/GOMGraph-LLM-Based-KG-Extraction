# Curated edge_type_map: 3-5 semantically appropriate types per entity pair.
# Entity,Entity serves as catchall for any pair not explicitly listed.
edge_type_map:

  # --- Catchall fallback ---
  "Entity,Entity":
    - AssociatedWith
    - HasCharacteristic
    - ComparesTo
    - DiffersFrom
    - ContainsOrHasPart

  # --- Plant-centric ---
  "Plant,Plant":
    - AlternativeOrReplacement
    - ComparesTo
    - DiffersFrom
    - VarietyOf
    - Precedes
  "Plant,Location":
    - LocatedInOrAt
    - OriginatesFrom
    - PlantedIn
    - GrownIn
  "Plant,Condition":
    - AffectedBy
    - ResistantTo
    - Requires
    - GrownIn
  "Plant,SoilType":
    - PlantedIn
    - Requires
    - GrowthStageRelatedTo
    - GrownIn
  "Plant,Time":
    - SeasonalRelatedness
    - TemporalAssociation
    - GrowthStageRelatedTo
    - Precedes
    - GrownIn
  "Plant,Input":
    - TreatedWithSomething
    - Requires
    - Uses
  "Plant,PlantPart":
    - ContainsOrHasPart
    - PartOf
    - HasCharacteristic
  "Plant,Practice":
    - Uses
    - Requires
    - PropagationMethod
    - SeedingRelationship
  "Plant,Pest":
    - AffectedBy
    - ResistantTo
    - ProtectionRelation
  "Plant,Disease":
    - AffectedBy
    - ResistantTo
    - Causes
  "Plant,Weather":
    - AffectedBy
    - ResistantTo
    - SeasonalRelatedness,
    - GrownIn
  "Plant,Nutrient":
    - Requires
    - AffectedBy
    - HasCharacteristic
  "Plant,Equipment":
    - Uses
    - Requires
    - ProtectionRelation
  "Plant,Structure":
    - LocatedInOrAt
    - ProtectionRelation
    - ContainsOrHasPart
    - GrownIn
  "Plant,People":
    - ProductionRelation
    - Uses
    - AssociatedWith

  # --- Practice-centric ---
  "Practice,Plant":
    - Uses
    - AffectedBy
    - ProductionRelation
  "Practice,Time":
    - TemporalAssociation
    - SeasonalRelatedness
    - Precedes
    - Follows
  "Practice,Input":
    - Uses
    - Requires
  "Practice,Equipment":
    - Uses
    - Requires
  "Practice,Practice":
    - Precedes
    - Follows
    - AlternativeOrReplacement
  "Practice,SoilType":
    - Requires
    - AffectedBy
    - AssociatedWith
  "Practice,Location":
    - LocatedInOrAt
    - AssociatedWith

  # --- Location / Structure ---
  "Location,Plant":
    - ContainsOrHasPart
    - ProductionRelation
  "Location,Location":
    - ContainsOrHasPart
    - PartOf
    - ComparesTo
  "Structure,Plant":
    - ContainsOrHasPart
    - ProtectionRelation
  "Structure,Structure":
    - ContainsOrHasPart
    - PartOf
    - ComparesTo

  # --- Input / Treatment ---
  "Input,Plant":
    - TreatedWithSomething
    - AffectedBy
    - ProductionRelation
  "Input,SoilType":
    - TreatedWithSomething
    - AffectedBy
  "Input,Input":
    - AlternativeOrReplacement
    - ComparesTo
    - ContainsOrHasPart

  # --- People / Institution ---
  "People,Plant":
    - Uses
    - ProductionRelation
  "People,Practice":
    - Uses
    - AssociatedWith
  "People,Institution":
    - AssociatedWith
    - PartOf
  "People,People":
    - AssociatedWith
    - ComparesTo
  "People,Location":
    - LocatedInOrAt
    - AssociatedWith
  "People,Equipment":
    - Uses
    - AssociatedWith
  "Institution,People":
    - AssociatedWith
    - ContainsOrHasPart
  "Institution,Location":
    - LocatedInOrAt
    - AssociatedWith

  # --- Weather / Condition ---
  "Weather,Plant":
    - AffectedBy
    - Causes
  "Weather,Practice":
    - AffectedBy
    - Requires
  "Condition,Plant":
    - AffectedBy
    - Causes
    - Requires

  # --- Pest / Disease ---
  "Pest,Plant":
    - AffectedBy
    - Causes
  "Disease,Plant":
    - AffectedBy
    - Causes
    - ResistantTo

  # --- PlantPart ---
  "PlantPart,Plant":
    - PartOf
    - ContainsOrHasPart
    - HasCharacteristic
  "PlantPart,PlantPart":
    - ContainsOrHasPart
    - PartOf
    - ComparesTo

  # --- Time ---
  "Time,Practice":
    - TemporalAssociation
    - SeasonalRelatedness
  "Time,Plant":
    - TemporalAssociation
    - SeasonalRelatedness
    - GrowthStageRelatedTo

  # --- Equipment ---
  "Equipment,Plant":
    - Uses
    - ProtectionRelation
  "Equipment,Practice":
    - Uses
    - AssociatedWith

  # --- SoilType ---
  "SoilType,Plant":
    - AffectedBy
    - Requires
    - HasCharacteristic
  "SoilType,Input":
    - TreatedWithSomething
    - Requires

  # --- Nutrient ---
  "Nutrient,Plant":
    - AffectedBy
    - Requires
  "Nutrient,SoilType":
    - ContainsOrHasPart
    - AffectedBy

  # --- Animal / Organism ---
  "Animal,Plant":
    - AffectedBy
    - Causes
    - Uses
  "Organism,Plant":
    - AffectedBy
    - Causes
    - AssociatedWith


