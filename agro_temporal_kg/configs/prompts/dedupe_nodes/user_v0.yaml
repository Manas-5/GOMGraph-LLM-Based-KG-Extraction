For each extracted node, return an object with:
- id: index into EXTRACTED_NODES
- duplicate_of: index into EXISTING_NODES if it is the same entity, otherwise -1

Only mark duplicates when they refer to the same real-world entity. Prefer reusing existing nodes instead of creating near-duplicates.
